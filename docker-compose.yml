services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gptcity
      POSTGRES_PASSWORD: gptcity
      POSTGRES_DB: gptcity
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
